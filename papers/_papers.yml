  citation: 'Hetherington E*, Darling E, **Harper S**, Nguyen F, Schummers L, Norman
    W. "Inequalities in Access to Prenatal Care during the COVID-19 Pandemic: Analysis
    of a Population-Based Cohort" 2024; 38: 291--301. DOI: [10.1111/ppe.13050](https://doi.org/10.1111/ppe.13050)
    Citations: 3'
  doi: 10.1111/ppe.13050
