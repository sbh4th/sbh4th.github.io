  citation: 'Hutcheon J, Riddell C, Strumpf E, Lee L, **Harper S**. "Safety of Labour
    and Delivery Following Closures of Obstetric Services in Small Community Hospitals"
    2017; 189: E431-E436. DOI: [10.1503/cmaj.160461](https://doi.org/10.1503/cmaj.160461)
