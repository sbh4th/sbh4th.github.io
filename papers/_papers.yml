  title: Trends In The Black-White Life Expectancy Gap Among US States, 1990–2009
  citation: '**Harper S**, MacLehose RF, Kaufman JS. "Trends In The Black-White Life
    Expectancy Gap Among US States, 1990–2009" 2014; 33: 1375--1382. DOI: [10.1377/hlthaff.2013.1273](https://doi.org/10.1377/hlthaff.2013.1273)
    Citations: 112'
  doi: 10.1377/hlthaff.2013.1273
  url: https://doi.org/10.1377/hlthaff.2013.1273
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:tkaPQYYpVKoC
  cites: 112
  abstract: Nationwide differences in US life expectancy trends for blacks and whites
    may mask considerable differences by state that are relevant to policies aimed
    at reducing health inequalities. We calculated annual state-specific life expectancies
    for blacks and whites from 1990 to 2009 using age-specific mortality counts and
    census-based denominators. Nationally, the black-white difference in life expectancy
    at birth shrank during the period by 2.7 years for males (from 8.1 to 5.4 years)
    and by 1.7 years for females (from 5.5 to 3.8 years). We found considerable variation
    across states in both the magnitude of the life expectancy gap (approximately
    fifteen years) and the change during the past two decades (about six years). Decomposition
    analysis showed that New York made the most profound contribution to reducing
    the gap, but less favorable trends in a number of states, notably California and
    Texas, kept the gap from shrinking further. Large state variations in the pace
    of change in the racial gap in life expectancy suggest that state-specific determinants
    merit further investigation. Life. © 2014 by Project HOPE - The People-to-People
    Health Foundation.
  has_summary: no
  year: '2014'
- key: harper2014a
  category: ARTICLE
  title: Implicit Value Judgments in the Measurement of Health Inequalities
  citation: '**Harper S**, King N, Meersman S, Reichman M, Breen N, Lynch J. "Implicit
    Value Judgments in the Measurement of Health Inequalities" 2014; 35: 293--304.
    Citations: 392'
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:LkGwnXOMwfcC
  cites: 392
  abstract: Context. Quantitative estimates of the magnitude, direction, and rate
    of change of health inequalities play a crucial role in creating and assessing
    policies aimed at eliminating the disproportionate burden of disease in disadvantaged
    populations. It is generally assumed that the measurement of health inequalities
    is a value-neutral process, providing objective data that are then interpreted
    using normative judgments about whether a particular distribution of health is
    just, fair, or socially acceptable. Methods. We discuss five examples in which
    normative judgments play a role in the measurement process itself, through either
    the selection of one measurement strategy to the exclusion of others or the selection
    of the type, significance, or weight assigned to the variables being measured.
    Findings. Overall, we find that many commonly used measures of inequality are
    value laden and that the normative judgments implicit in these measures have important
    consequences for interpreting and responding to health inequalities. Conclusions.
    Because values implicit in the generation of health inequality measures may lead
    to radically different interpretations of the same underlying data,we urge researchers
    to explicitly consider and transparently discuss the normative judgments underlying
    their measures. We also urge policymakers and other consumers of health inequalities
    data to pay close attention to the measures on which they base their assessments
    of current and future health policies.
