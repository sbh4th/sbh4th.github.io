  citation: 'Mejia G, Elani H, **Harper S**, Murray Thomson W, Ju X, Kawachi I, Kaufman
    J, Jamieson L. "Socioeconomic Status, Oral Health and Dental Disease in Australia,
    Canada, New Zealand and the United States" 2018; 18: DOI: [10.1186/s12903-018-0630-3](https://doi.org/10.1186/s12903-018-0630-3)
