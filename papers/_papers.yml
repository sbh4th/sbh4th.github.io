  title: 'Effects of a Coal to Clean Heating Policy on Acute Myocardial Infarction
    in Beijing: A Difference-in-Differences Analysis'
  citation: 'Lee M, Chang J, Deng Q, Hu P, Bixby H, **Harper S**, Liu J. "Effects
    of a Coal to Clean Heating Policy on Acute Myocardial Infarction in Beijing: A
    Difference-in-Differences Analysis" 2024; 8: 924--932. DOI: [10.1016/S2542-5196(24)00243-2](https://doi.org/10.1016/S2542-5196(24)00243-2)
