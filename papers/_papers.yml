  title: 'The "Americanisation" of Migrants: Evidence for the Contribution of Ethnicity,
    Social Deprivation, Lifestyle and Life-Course Processes to the Mid-20th Century
    Coronary Heart Disease Epidemic in the US'
  citation: 'Kelleher C, Lynch J, Daly L, **Harper S**, Fitz-simon N, Bimpeh Y, Daly
    E, Ulmer H. "The "Americanisation" of Migrants: Evidence for the Contribution
    of Ethnicity, Social Deprivation, Lifestyle and Life-Course Processes to the Mid-20th
    Century Coronary Heart Disease Epidemic in the US" 2006; 63: 465--484. DOI: [10.1016/j.socscimed.2005.12.017](https://doi.org/10.1016/j.socscimed.2005.12.017)'
  doi: 10.1016/j.socscimed.2005.12.017
  url: https://doi.org/10.1016/j.socscimed.2005.12.017
  abstract: We investigated the contribution of the large-scale immigration of White
    Europeans into the US between 1850 and 1930 to the timing and extent of the epidemic
    pattern of heart disease between 1900 and 1980. The analyses are based on data
    collected through the United States Federal Census from 1850 to the present. The
    hardcopy historical record confirms that census reports themselves and related
    monographs were concerned from 1850 with excessive mortality from heart disease
    of immigrants, particularly of Northern European origin and initially at least,
    their first-generation native-born children. Our analysis of the electronic database
    indicates a strong relationship between the percentage of US population foreign
    born and native born of foreign parentage and age adjusted mortality from heart
    disease. We identified a lag of 50 years giving the maximum linear correlation
    coefficient for men ( r2 = 0.92), and for women a shorter lag of 38 years and
    an earlier decline in Coronary Heart Disease (CHD) rates ( r2 = 0.96). Both the
    rise and fall of the CHD epidemic over an 80-year period correspond closely to
    the rise and fall of the foreign population in previous years. For the foreign
    born only, age adjusted negative binomial general estimated equation (GEE) models
    calculate the relative risk of dying of heart disease per 10\% increase in proportion
    foreign born. There is an independent influence for men until 1930 and for women
    throughout the period from 1910 onwards. We conclude there is an impact of immigration
    on the pattern of the epidemic, mediated through a combination of factors, such
    as accumulated life-course susceptibility, deprived socio-economic conditions
    upon arrival, and the enthusiastic uptake of behaviours related to the classic
    risk factors of smoking, high saturated fat and salt diet. Our analysis provides
    a more contextualised understanding of the scale and timing of the epidemic of
    CHD in the US. © 2006 Elsevier Ltd. All rights reserved.
  has_summary: no
  year: '2006'
- key: lynch2006
  category: ARTICLE
  title: 'Explaining the Social Gradient in Coronary Heart Disease: Comparing Relative
    and Absolute Risk Approaches'
  citation: 'Lynch J, Smith G, **Harper S**, Bainbridge K. "Explaining the Social
    Gradient in Coronary Heart Disease: Comparing Relative and Absolute Risk Approaches"
    2006; 60: 436--441. DOI: [10.1136/jech.2005.041350](https://doi.org/10.1136/jech.2005.041350)
    Citations: 233'
  doi: 10.1136/jech.2005.041350
  url: https://doi.org/10.1136/jech.2005.041350
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:2osOgNQ5qMEC
  cites: 233
  abstract: 'Study objectives: There are contradictory perspectives on the importance
    of conventional coronary heart disease (CHD) risk factors in explaining population
    levels and social gradients in CHD. This study examined the contribution of conventional
    CHD risk factors (smoking, hypertension, dyslipidaemia, and diabetes) to explaining
    population levels and to absolute and relative social inequalities in CHD. This
    was investigated in an entire population and by creating a low risk sub-population
    with no smoking, dyslipidaemia, diabetes, and hypertension to simulate what would
    happen to relative and social inequalities in CHD if conventional risk factors
    were removed. Design, setting, and participants: Population based study of 2682
    eastern Finnish men aged 42, 48, 54, 60 at baseline with 10.5 years average follow
    up of fatal (ICD9 codes 410-414) and non-fatal (MONICA criteria) CHD events. Main
    results: In the whole population, 94.6\% of events occurred among men exposed
    to at least one conventional risk factor, with a PAR of 68\%. Adjustment for conventional
    risk factors reduced relative social inequality by 24\%. However, in a low risk
    population free from conventional risk factors, absolute social inequality reduced
    by 72\%. Conclusions: Conventional risk factors explain the majority of absolute
    social inequality in CHD because conventional risk factors explain the vast majority
    of CHD cases in the population. However, the role of conventional risk factors
    in explaining relative social inequality was modest. This apparent paradox may
    arise in populations where inequalities in conventional risk factors between social
    groups are low, relative to the high levels of conventional risk factors within
    every social group. If the concern is to reduce the overall population health
    burden of CHD and the disproportionate population health burden associated with
    the social inequalities in CHD, then reducing conventional risk factors will do
    the job.'
  has_summary: no
  year: '2006'
- key: huynh2005
  category: ARTICLE
  title: Contextual Effect of Income Inequality on Birth Outcomes
  citation: 'Huynh M, Parker J, **Harper S**, Pamuk E, Schoendorf K. "Contextual Effect
    of Income Inequality on Birth Outcomes" 2005; 34: 888--895. DOI: [10.1093/ije/dyi092](https://doi.org/10.1093/ije/dyi092)'
  doi: 10.1093/ije/dyi092
  url: https://doi.org/10.1093/ije/dyi092
  abstract: 'Background: Though associations between income inequality and birth outcome
    have been suggested, mechanisms underlying this relationship are not known. In
    this analysis, we examined the relationship between income inequality and preterm
    birth (PTB) and post-neonatal mortality (PNM) to explore two potential mechanisms
    - the proposed psychosocial stress and neo-material pathways. Methods: Data on
    singleton births from 1998 to 2000 were obtained from the CDC''s National Center
    for Health Statistics'' Linked Birth and Infant Death files. The Gini Index was
    utilized to measure income inequality and was divided into tertiles representing
    high, medium, and low county-level inequality. To determine the association between
    the birth outcomes and county income inequality and to account for clustering
    within counties, we employed generalized estimating equation (GEE) modelling.
    Results: PTB increased from 8.3\% in counties with low income inequality to 10.0\%
    in counties with high inequality. The Gini Index remained modestly associated
    with PTB after adjusting for individual level variables and mean county-level
    per capita income within the total population (AOR: 1.06; 95\% CI 1.03-1.09) as
    well as within most of the racial/ethnic groups. PNM increased from 1.15 deaths
    per 1000 live births in low inequality counties to 1.32 in high-inequality counties.
    However, after adjustment, income inequality was only associated with PNM within
    the non-Hispanic black population (AOR: 1.20; 95\% CI 1.03-1.39). Conclusions:
    These findings may provide some support for the association between income inequality
    and PTB. Further research is required to elucidate the biological mechanisms of
    income inequality.'
  has_summary: no
  year: '2005'
