  title: Depression-Related Weight Change and Incident Diabetes in a Community Sample
  citation: 'Graham E, Watson T, Deschênes S, Filion K, Henderson M, **Harper S**,
    Rosella L, Schmitz N. "Depression-Related Weight Change and Incident Diabetes
    in a Community Sample" 2021; 11: DOI: [10.1038/s41598-021-92963-w](https://doi.org/10.1038/s41598-021-92963-w)
    Citations: 9'
  doi: 10.1038/s41598-021-92963-w
