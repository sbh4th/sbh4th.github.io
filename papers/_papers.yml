  title: Using Inequality Measures to Incorporate Environmental Justice into Regulatory
    Analyses
  citation: '**Harper S**, Ruder E, Roman H, Geggel A, Nweke O, Payne-Sturges D, Levy
    J. "Using Inequality Measures to Incorporate Environmental Justice into Regulatory
    Analyses" 2013; 10: 4039--4059. DOI: [10.3390/ijerph10094039](https://doi.org/10.3390/ijerph10094039)
    Citations: 63'
  doi: 10.3390/ijerph10094039
  url: https://doi.org/10.3390/ijerph10094039
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:l7t_Zn2s7bgC
  cites: 63
  abstract: Formally evaluating how specific policy measures influence environmental
    justice is challenging, especially in the context of regulatory analyses in which
    quantitative comparisons are the norm. However, there is a large literature on
    developing and applying quantitative measures of health inequality in other settings,
    and these measures may be applicable to environmental regulatory analyses. In
    this paper, we provide information to assist policy decision makers in determining
    the viability of using measures of health inequality in the context of environmental
    regulatory analyses. We conclude that quantification of the distribution of inequalities
    in health outcomes across social groups of concern, considering both within-group
    and between-group comparisons, would be consistent with both the structure of
    regulatory analysis and the core definition of environmental justice. Appropriate
    application of inequality indicators requires thorough characterization of the
    baseline distribution of exposures and risks, leveraging data generally available
    within regulatory analyses. Multiple inequality indicators may be applicable to
    regulatory analyses, and the choice among indicators should be based on explicit
    value judgments regarding the dimensions of environmental justice of greatest
    interest. © 2013 by the authors; licensee MDPI, Basel, Switzerland.
