  citation: 'Young M, King N, **Harper S**, Humphreys K. "The Influence of Popular
    Media on Perceptions of Personal and Population Risk in Possible Disease Outbreaks"
    2013; 15: 103--114. DOI: [10.1080/13698575.2012.748884](https://doi.org/10.1080/13698575.2012.748884)
    Citations: 92'
  doi: 10.1080/13698575.2012.748884
