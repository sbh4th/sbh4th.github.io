  title: The Effect of Metropolitan-Area Mortgage Delinquency on Health Behaviors,
    Access to Health Services, and Self-Rated Health in the United States, 2003-2010
  citation: 'Charters T, **Harper S**, Strumpf E, Subramanian S, Arcaya M, Nandi A.
    "The Effect of Metropolitan-Area Mortgage Delinquency on Health Behaviors, Access
    to Health Services, and Self-Rated Health in the United States, 2003-2010" 2016;
    161: 74--82. DOI: [10.1016/j.socscimed.2016.05.021](https://doi.org/10.1016/j.socscimed.2016.05.021)
    Citations: 17'
  doi: 10.1016/j.socscimed.2016.05.021
  url: https://doi.org/10.1016/j.socscimed.2016.05.021
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:tzM49s52ZIMC
  cites: 17
  abstract: The recent housing crisis offers the opportunity to understand the effects
    of unique indicators of macroeconomic conditions on health. We linked data on
    the proportion of mortgage borrowers per US metropolitan-area who were at least
    90 days delinquent on their payments with individual-level outcomes from a representative
    sample of 1,021,341 adults surveyed through the Behavioral Risk Factor Surveillance
    System (BRFSS) between 2003 and 2010. We estimated the effects of metropolitan-area
    mortgage delinquency on individual health behaviors, medical coverage, and health
    status, as well as whether effects varied by race/ethnicity. Results showed that
    increases in the metropolitan-area delinquency rate resulted in decreases in heavy
    alcohol consumption and increases in exercise and health insurance coverage. However,
    the delinquency rate was also associated with increases in smoking and obesity
    in some population groups, suggesting the housing crisis may have induced stress-related
    behavioral change. Overall, the effects of metropolitan-area mortgage delinquency
    on population health were relatively modest. © 2016 Elsevier Ltd.
  has_summary: no
  year: '2016'
- key: gray2016
  category: ARTICLE
  title: Individual- and Community-Level Determinants of Inuit Youth Mental Wellness
  citation: 'Gray A, Richer F, **Harper S**. "Individual- and Community-Level Determinants
    of Inuit Youth Mental Wellness" 2016; 107: e251-e257. DOI: [10.17269/CJPH.107.5342](https://doi.org/10.17269/CJPH.107.5342)'
  doi: 10.17269/CJPH.107.5342
  url: https://doi.org/10.17269/CJPH.107.5342
  abstract: 'OBJECTIVES: Following the onset of intensive colonial intervention and
    rapid social change in the lives of Inuit people, youth in Nunavik have experienced
    high rates of mental health problems and suicide. Inuit people describe a broad
    range of contextual influences on mental wellness based on lived experience, but
    most epidemiological studies have focused on individual risk factors and pathologies.
    This study aimed to assess the influence of multiple determinants of mental wellness
    among Inuit youth in Nunavik, including culturally meaningful activities, housing
    and community social characteristics. METHODS: Mental wellness was measured in
    the form of two primary outcomes: self-esteem and suicidal ideation. Using cross-sectional
    data from the 2004 Nunavik Inuit Health Survey and multilevel regression modelling,
    we estimated associations between these two outcomes and various independent individual-
    and community-level explanatory factors among Inuit youth. All variables were
    selected to reflect Inuit perspectives on determinants of mental wellness. The
    study design and interpretation of results were validated with Inuit community
    representatives. RESULTS: Pride in Inuit identity, traditional activities, community-level
    social support and community-level socio-economic status were found to be protective.
    Barriers to participating in traditional activities, household crowding and high
    community rates of violence were risk factors. CONCLUSION: These findings support
    Inuit perspectives, expand the scope of epidemiological analysis of Inuit mental
    wellness and reinforce the need for locally informed, community-wide approaches
    to mental wellness promotion for Inuit youth. © 2016 Canadian Public Health Association
    or its licensor.'
  has_summary: no
  year: '2016'
- key: hajna2016
  category: ARTICLE
  title: Neighbourhood Walkability and Daily Steps in Adults with Type 2 Diabetes
  citation: 'Hajna S, Ross N, Joseph L, **Harper S**, Dasgupta K. "Neighbourhood Walkability
    and Daily Steps in Adults with Type 2 Diabetes" 2016; 11: DOI: [10.1371/journal.pone.0151544](https://doi.org/10.1371/journal.pone.0151544)
    Citations: 45'
  doi: 10.1371/journal.pone.0151544
  url: https://doi.org/10.1371/journal.pone.0151544
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:NJ774b8OgUMC
  cites: 45
  abstract: 'Introduction: There is evidence that greater neighbourhood walkability
    (i.e., neighbourhoods with more amenities and well-connected streets) is associated
    with higher levels of total walking in Europe and in Asia, but it remains unclear
    if this association holds in the Canadian context and in chronic disease populations.
    We examined the relationships of different walkability measures to biosensor-assessed
    total walking (i.e., steps/day) in adults with type 2 diabetes living in Montreal
    (QC, Canada). Materials and Methods: Participants (60.5±10.4 years; 48.1\% women)
    were recruited through McGill University-affiliated clinics (June 2006 to May
    2008). Steps/day were assessed once per season for one year with pedometers. Neighbourhood
    walkability was evaluated through participant reports, in-field audits, Geographic
    Information Systems (GIS)-derived measures, and the Walk Score®. Relationships
    between walkability and daily steps were estimated using Bayesian longitudinal
    hierarchical linear regression models (n = 131). Results: Participants who reported
    living in the most compared to the least walkable neighbourhoods completed 1345
    more steps/day (95\% Credible Interval: 718,1976; Quartiles 4 versus 1). Those
    living in the most compared to the least walkable neighbourhoods (based on GIS-derived
    walkability) completed 606 more steps per day (95\% CrI: 8,1203). No statistically
    significant associations with steps were observed for audit-assessed walkability
    or the Walk Score®. Conclusions: Adults with type 2 diabetes who perceived their
    neighbourhoods as more walkable accumulated more daily steps. This suggests that
    knowledge of local neighborhood features that enhance walking is a meaningful
    predictor of higher levels of walking and an important component of neighbourhood
    walkability. © 2016 Hajna et al. This is an open access article distributed under
    the terms of the Creative Commons Attribution License, which permits unrestricted
    use, distribution, and reproduction in any medium, provided the original author
    and source are credited.'
