  title: The Annual Cannabis Holiday and Fatal Traffic Crashes
  citation: '**Harper S**, Palayew A. "The Annual Cannabis Holiday and Fatal Traffic
    Crashes" 2019; 25: 433--437. DOI: [10.1136/injuryprev-2018-043068](https://doi.org/10.1136/injuryprev-2018-043068)
    Citations: 9'
