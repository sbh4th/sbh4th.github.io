  title: 'Changes in Socioeconomic Inequality in Indonesian Children’s Cognitive Function
    from 2000 to 2007: A Decomposition Analysis'
  citation: 'Maika A, Mittinty MN, Brinkman S, **Harper S**, Satriawan E, Lynch JW.
    "Changes in Socioeconomic Inequality in Indonesian Children’s Cognitive Function
    from 2000 to 2007: A Decomposition Analysis" 2013; 8: e78809. DOI: [10.1371/journal.pone.0078809](https://doi.org/10.1371/journal.pone.0078809)
    Citations: 39'
