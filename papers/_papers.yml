  title: Is Income Inequality a Determinant of Population Health? Part 1. A Systematic
    Review
  citation: 'Lynch J, Smith GD, **Harper S**, Hillemeier M, Ross N, Kaplan GA, Wolfson
    M. "Is Income Inequality a Determinant of Population Health? Part 1. A Systematic
    Review" 2004; 82: 5--99. DOI: [10.1111/j.0887-378x.2004.00302.x](https://doi.org/10.1111/j.0887-378x.2004.00302.x)
    Citations: 1328'
  doi: 10.1111/j.0887-378x.2004.00302.x
  url: https://doi.org/10.1111/j.0887-378x.2004.00302.x
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:u5HHmVD_uO8C
  cites: 1328
  abstract: This article reviews 98 aggregate and multilevel studies examining the
    associations between income inequality and health. Overall, there seems to be
    little support for the idea that income inequality is a major, generalizable determinant
    of population health differences within or between rich countries. Income inequality
    may, however, directly influence some health outcomes, such as homicide in some
    contexts. The strongest evidence for direct health effects is among states in
    the United States, but even that is somewhat mixed. Despite little support for
    a direct effect of income inequality on health per se, reducing income inequality
    by raising the incomes of the most disadvantaged will improve their health, help
    reduce health inequalities, and generally improve population health.
  has_summary: no
  year: '2004'
- key: lynch2004a
  category: ARTICLE
  title: Is Income Inequality a Determinant of Population Health? Part 2. U.S. National
    and Regional Trends in Income Inequality and Age- and Cause-Specific Mortality
  citation: 'Lynch J, Smith G, **Harper S**, Hillemeier M. "Is Income Inequality a
    Determinant of Population Health? Part 2. U.S. National and Regional Trends in
    Income Inequality and Age- and Cause-Specific Mortality" 2004; 82: 355--400. DOI:
    [10.1111/j.0887-378X.2004.00312.x](https://doi.org/10.1111/j.0887-378X.2004.00312.x)'
  doi: 10.1111/j.0887-378X.2004.00312.x
  url: https://doi.org/10.1111/j.0887-378X.2004.00312.x
  abstract: This article describes U.S. income inequality and 100-year national and
    30-year regional trends in age- and cause-specific mortality. There is little
    congruence between national trends in income inequality and age- or cause-specific
    mortality except perhaps for suicide and homicide. The variable trends in some
    causes of mortality may be associated regionally with income inequality. However,
    between 1978 and 2000 those regions experiencing the largest increases in income
    inequality had the largest declines in mortality (r = 0.81, p {$<$} 0.001). Understanding
    the social determinants of population health requires appreciating how broad indicators
    of social and economic conditions are related, at different times and places,
    to the levels and social distribution of major risk factors for particular health
    outcomes.
  has_summary: no
  year: '2004'
