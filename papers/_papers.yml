  title: Multi-Year Evaluation of a Clean Heating Policy on Residents’ Air Pollution
    Exposures in Beijing, China
  citation: 'Li X, Brehmer C, Hirst K, Sternbach T, Yuan W*, Zhang X, Barrington-Leigh
    C, Baumgartner J, **Harper S**, Robinson B, Shen G, Tao S, Zhang Y, Carter E.
    "Multi-Year Evaluation of a Clean Heating Policy on Residents’ Air Pollution Exposures
    in Beijing, China" 2025; 59: 24347--24358. DOI: [10.1021/acs.est.5c05769](https://doi.org/10.1021/acs.est.5c05769)
    Citations: 0'
