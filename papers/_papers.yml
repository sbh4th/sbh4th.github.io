    Behavioral, and Household Energy-Use Paradigms'
  citation: 'Ma J, Zhu X, Li X, Zhang X, Zhao F, Zhao A, Xue K, Song Q, Wang L, Zhang
    X, Carter E, **Harper S**, Robinson B, Baumgartner J, Zhang Y. "Investigating
