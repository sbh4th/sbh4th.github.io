  citation: '**Harper S**, King NB, Meersman SC, Reichman ME, Breen N, Lynch J. "Implicit
    Value Judgments in the Measurement of Health Inequalities" 2010; 88: 4--29. DOI:
    [10.1111/j.1468-0009.2010.00587.x](https://doi.org/10.1111/j.1468-0009.2010.00587.x)
