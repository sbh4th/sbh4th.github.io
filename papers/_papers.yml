  title: 'The Impact of Parental and Medical Leave Policies on Socioeconomic and Health
    Outcomes in OECD Countries: A Systematic Review of the Empirical Literature'
  citation: 'Nandi A, Jahagirdar D, Dimitris M, Labrecque J, Strumpf E, Kaufman J,
    Vincent I, Atabay E, **Harper S**, Earle A, Heymann S. "The Impact of Parental
    and Medical Leave Policies on Socioeconomic and Health Outcomes in OECD Countries:
