  title: 'Maternal Education and Stillbirth: Estimating Gestational-Age-Specific and
    Cause-Specific Associations'
  citation: 'Auger N, Delézire P, **Harper S**, Platt R. "Maternal Education and Stillbirth:
    Estimating Gestational-Age-Specific and Cause-Specific Associations" 2012; 23:
    247--254. DOI: [10.1097/EDE.0b013e31824587bc](https://doi.org/10.1097/EDE.0b013e31824587bc)
