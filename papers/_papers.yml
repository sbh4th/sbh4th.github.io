  citation: 'Lynch J, **Harper S**, Kaplan G, Smith G. "Associations between Income
    Inequality and Mortality among US States: The Importance of Time Period and Source
    of Income Data" 2005; 95: 1424--1430. DOI: [10.2105/AJPH.2004.048439](https://doi.org/10.2105/AJPH.2004.048439)
    Citations: 62'
  doi: 10.2105/AJPH.2004.048439
