- key: hajna2015
  category: ARTICLE
  title: Neighbourhood Walkability, Daily Steps and Utilitarian Walking in Canadian
    Adults
  citation: 'Hajna S, Ross N, Joseph L, **Harper S**, Dasgupta K. "Neighbourhood Walkability,
    Daily Steps and Utilitarian Walking in Canadian Adults" 2015; 5: DOI: [10.1136/bmjopen-2015-008964](https://doi.org/10.1136/bmjopen-2015-008964)
    Citations: 89'
  doi: 10.1136/bmjopen-2015-008964
  url: https://doi.org/10.1136/bmjopen-2015-008964
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:_Ybze24A_UAC
  cites: 89
  abstract: 'Objectives: To estimate the associations of neighbourhood walkability
    (based on Geographic Information System (GIS)-derived measures of street connectivity,
    land use mix, and population density and the Walk Score) with self-reported utilitarian
    walking and accelerometer-assessed daily steps in Canadian adults. Design: A cross-sectional
    analysis of data collected as part of the Canadian Health Measures Survey (2007-2009).
    Setting: Home neighbourhoods (500 m polygonal street network buffers around the
    centroid of the participant''s postal code) located in Atlantic Canada, Québec,
    Ontario, the Prairies and British Columbia. Participants: 5605 individuals participated
    in the survey. 3727 adults (≥18 years) completed a computer-assisted interview
    and attended a mobile clinic assessment. Analyses were based on those who had
    complete exposure, outcome and covariate data (n = 2949). Main exposure measures:
    GIS-derived walkability (based on land use mix, street connectivity and population
    density); Walk Score. Main outcome measures: Self-reported utilitarian walking;
    accelerometer-assessed daily steps. Results: No important relationship was observed
    between neighbourhood walkability and daily steps. Participants who reported more
    utilitarian walking, however, accumulated more steps ({$<$}1 h/week: 6613 steps/day,
    95\% CI 6251 to 6975; 1 to 5 h/week: 6768 steps/day, 95\% CI 6420 to 7117; ≥6
    h/week: 7391 steps/day, 95\% CI 6972 to 7811). There was a positive graded association
    between walkability and odds of walking ≥1 h/week for utilitarian purposes (eg,
    Q4 vs Q1 of GIS-derived walkability: OR = 1.66, 95\% CI 1.31 to 2.11; Q3 vs Q1:
    OR = 1.41, 95\% CI 1.14 to 1.76; Q2 vs Q1: OR = 1.13, 95\% CI 0.91 to 1.39) independent
    of age, sex, body mass index, married/common law status, annual household income,
    having children in the household, immigrant status, mood disorder, perceived health,
    ever smoker and season. Conclusions: Contrary to expectations, living in more
    walkable Canadian neighbourhoods was not associated with more total walking. Utilitarian
    walking and daily steps were, however, correlated and walkability demonstrated
    a positive graded relationship with utilitarian walking.'
  has_summary: no
  year: '2015'
- key: harper2015a
  category: ARTICLE
  title: 'Economic Downturns and Suicide Mortality in the USA, 1980-2010: Observational
    Study'
  citation: '**Harper S**, Charters T, Strumpf E, Galea S, Nandi A. "Economic Downturns
    and Suicide Mortality in the USA, 1980-2010: Observational Study" 2015; 44: 956--966.
    DOI: [10.1093/ije/dyv009](https://doi.org/10.1093/ije/dyv009) Citations: 67'
  doi: 10.1093/ije/dyv009
  url: https://doi.org/10.1093/ije/dyv009
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:ZuybSZzF8UAC
  cites: 67
  abstract: 'Background: Several studies have suggested strong associations between
    economic downturns and suicide mortality, but are at risk of bias due to unmeasured
    confounding. The rationale for our study was to provide more robust evidence by
    using a quasi-experimental design.Methods: We analysed 955561 suicides occurring
    in the USA from 1980 to 2010 and used a broad index of economic activity in each
    US state to measure economic conditions. We used a quasi-experimental, fixed-effects
    design and we also assessed whether the effects were heterogeneous by demographic
    group and during periods of official recession.Results: After accounting for secular
    trends, seasonality and unmeasured fixed characteristics of states, we found that
    an economic downturn similar in magnitude to the 2007 Great Recession increased
    suicide mortality by 0.14 deaths per 100 000 population [95\% confidence interval
    (CI) 0.00, 0.28] or around 350 deaths. Effects were stronger for men (0.28, 95\%
    CI 0.07, 0.49) than women and for those with less than 12 years of education (1.22
    95\% CI 0.83, 1.60) compared with more than 12 years of education. The overall
    effect did not differ for recessionary (0.11, 95\% CI -0.02, 0.25) vs non-recessionary
    periods (0.15, 95\% CI 0.01, 0.29). The main study limitation is the potential
    for misclassified death certificates and we cannot definitively rule out unmeasured
    confounding.Conclusions: We found limited evidence of a strong, population-wide
    detrimental effect of economic downturns on suicide mortality. The overall effect
    hides considerable heterogeneity by gender, socioeconomic position and time period.
    © The Author 2015; all rights reserved. Published by Oxford University Press on
    behalf of the International Epidemiological Association.'
  has_summary: no
  year: '2015'
- key: harper2015b
  category: ARTICLE
  title: Trends in Socioeconomic Inequalities in Motor Vehicle Accident Deaths in
    the United States, 1995-2010
  citation: '**Harper S**, Charters T, Strumpf E. "Trends in Socioeconomic Inequalities
    in Motor Vehicle Accident Deaths in the United States, 1995-2010" 2015; 182: 606--614.
    DOI: [10.1093/aje/kwv099](https://doi.org/10.1093/aje/kwv099) Citations: 99'
  doi: 10.1093/aje/kwv099
  url: https://doi.org/10.1093/aje/kwv099
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:dQ2og3OwTAUC
  cites: 99
  abstract: 'Motor vehicle accident (MVA) mortality has been declining overall, but
    little is known about trends by socioeconomic position. We examined trends in
    education-related inequalities in US MVA death rates from 1995 to 2010. We used
    mortality data from the National Center for Health Statistics and population estimates
    from the Current Population Survey, and we calculated vehicle- and person-miles
    traveled using data from the National Household Travel Survey. We used negative
    binomial regression to estimate crude and age-, sex-, and race-adjusted mortality
    rates among adults aged 25 years or more. We found larger mortality decreases
    among the more highly educated and some evidence of mortality increases among
    the least educated. Adjusted death rates were 15.3 per 100,000 population (95\%
    confidence interval (CI): 10.7, 19.9) higher at the bottom of the education distribution
    than at the top of the education distribution in 1995, increasing to 17.9 per
    100,000 population (95\% CI: 14.8, 21.0) by 2010. In relative terms, adjusted
    death rates were 2.4 (95\% CI: 1.7, 3.0) times higher at the bottom of the education
    distribution than at the top in 1995, increasing to 4.3 times higher (95\% CI:
    3.4, 5.3) by 2010. Inequality increases were larger in terms of vehicle-miles
    traveled. Although overall MVA death rates declined during this period, socioeconomic
    differences in MVA mortality have persisted or worsened over time. © The Author
    2015. Published by Oxford University Press on behalf of the Johns Hopkins Bloomberg
    School of Public Health.'
  has_summary: no
  year: '2015'
- key: hutcheon2015
  category: ARTICLE
  title: Using Inter-Institutional Practice Variation to Understand the Risks and
    Benefits of Routine Labour Induction at 41+0 Weeks
  citation: 'Hutcheon J, **Harper S**, Strumpf E, Lee L, Marquette G. "Using Inter-Institutional
    Practice Variation to Understand the Risks and Benefits of Routine Labour Induction
    at 41+0 Weeks" 2015; 122: 973--981. DOI: [10.1111/1471-0528.13007](https://doi.org/10.1111/1471-0528.13007)'
  doi: 10.1111/1471-0528.13007
  url: https://doi.org/10.1111/1471-0528.13007
  abstract: Objective To evaluate the risks and benefits of routine labour induction
    at 41+0 weeks' gestation for mother and newborn. Design Population-based retrospective
    cohort study of inter-institutional variation in labour induction practices for
    women at or beyond 41+0 weeks' gestation. Population Women in British Columbia,
    Canada, who remained pregnant ≥41+0 weeks and delivered at one of the province's
    42 hospitals with {$>$}50 annual deliveries, 2008-2012 (n = 14 627). Methods The
    proportion of women remaining pregnant a week or more past the expected delivery
    date who were induced at 41+0 or 41+1 weeks' gestation for an indication of 'post-dates'
    was calculated for each institution. We used instrumental variable analysis (using
    the institutional rate of labour induction at 41+0 weeks as the instrument) to
    estimate the effect of labour induction on maternal and neonatal health outcomes.
    Main outcome measures Caesarean delivery, instrumental delivery, post-partum haemorrhage,
    3rd or 4th degree lacerations, macrosomia, neonatal intensive care unit admission,
    and 5-minute Apgar score {$<$}7. Results Institutional rates of labour induction
    at 41+0 weeks ranged from 14.3 to 46\%. Institutions with higher (≥30\%) and average
    (20-29.9\%) induction rates did not have significantly different rates of caesarean
    delivery, instrumental delivery, or other maternal or neonatal outcomes than institutions
    with lower induction rates ({$<$}20\%). Instrumental variable analyses also demonstrated
    no significantly increased (or decreased) risk of caesarean delivery (0.69 excess
    cases per 100 pregnancies [95\% CI -10.1, 11.5]), instrumental delivery (8.9 per
    100 [95\% CI -2.3, 20.2]), or other maternal or neonatal outcomes in women who
    were induced (versus not induced). Conclusions Within the current range of clinical
    practice, there was no evidence that differential use of routine induction at
    41+0 weeks affected maternal or neonatal health outcomes. © 2014 Royal College
    of Obstetricians and Gynaecologists.
  has_summary: no
  year: '2015'
- key: hutcheon2015a
  category: ARTICLE
  title: 'Maternal and Neonatal Outcomes after Implementation of a Hospital Policy
    to Limit Low-Risk Planned Caesarean Deliveries before 39 Weeks of Gestation: An
    Interrupted Time-Series Analysis'
  citation: 'Hutcheon J, Strumpf E, **Harper S**, Giesbrecht E. "Maternal and Neonatal
    Outcomes after Implementation of a Hospital Policy to Limit Low-Risk Planned Caesarean
    Deliveries before 39 Weeks of Gestation: An Interrupted Time-Series Analysis"
    2015; 122: 1200--1206. DOI: [10.1111/1471-0528.13396](https://doi.org/10.1111/1471-0528.13396)'
  doi: 10.1111/1471-0528.13396
  url: https://doi.org/10.1111/1471-0528.13396
  abstract: Objective To evaluate the extent to which implementing a hospital policy
    to limit planned caesarean deliveries before 39 weeks of gestation improved neonatal
    health, maternal health, and healthcare costs. Design Retrospective cohort study.
    Setting British Columbia Women's Hospital, Vancouver, Canada, in the period 2005-2012.
    Population Women with a low-risk planned repeat caesarean delivery. Methods An
    interrupted time series design was used to evaluate the policy to limit planned
    caesarean deliveries before 39 weeks of gestation, introduced on 1 April 2008.
    Main outcome measures Composite adverse neonatal health outcome (respiratory morbidity,
    5-minute Apgar score of {$<$}7, neonatal intensive care unit admission, mortality),
    postpartum haemorrhage, obstetrical wound infection, out-of-hour deliveries, length
    of stay, and healthcare costs. Results Between 2005 and 2008, 60\% (1204/2021)
    of low-risk planned caesarean deliveries were performed before 39 weeks of gestation.
    After the introduction of the policy, the proportion of planned caesareans dropped
    by 20 percentage points (adjusted risk difference of 20 fewer cases per 100 deliveries;
    95\% CI -25.8, -14.3) to 41\% (1033/2518). The policy had no detectable impact
    on adverse neonatal outcomes (2.2 excess cases per 100; 95\% CI -0.4, 4.8), maternal
    complications, or healthcare costs, but increased the risk of out-of-hours delivery
    from 16.2 to 21.1\% (adjusted risk difference 6.3 per 100; 95\% CI 1.6, 10.9).
    Conclusions We found little evidence that a hospital policy to limit planned caesareans
    before 39 weeks of gestation reduced adverse neonatal outcomes. Hospital administrators
    intending to introduce such policies should anticipate, and plan for, modest increases
    in out-of-hours and emergency-timing. Tweetable abstract Implementing a policy
    to limit planned caesareans before 39 weeks of gestation did not improve newborn
    health. © 2015 Royal College of Obstetricians and Gynaecologists.
  has_summary: no
  year: '2015'
- key: McKinnon:2015aa
  category: ARTICLE
  title: 'Removing User Fees for Facility-Based Delivery Services: A Difference-in-Differences
    Evaluation from Ten Sub-Saharan African Countries'
  citation: 'McKinnon B, **Harper S**, Kaufman JS, Bergevin Y. "Removing User Fees
    for Facility-Based Delivery Services: A Difference-in-Differences Evaluation from
    Ten Sub-Saharan African Countries" 2015; 30: 432--41. DOI: [10.1093/heapol/czu027](https://doi.org/10.1093/heapol/czu027)
    Citations: 198'
  doi: 10.1093/heapol/czu027
  url: https://doi.org/10.1093/heapol/czu027
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:1qzjygNMrQYC
  cites: 198
  abstract: 'BACKGROUND: Several countries in sub-Saharan Africa have recently adopted
    policies that remove user fees for facility-based delivery services. There is
    little rigorous evidence of the impact of these policies on utilization of delivery
    services and no evaluations have examined effects on neonatal mortality rates
    (NMR). In this article, we estimate the causal effect of removing user fees on
    the proportion of births delivered in facilities, the proportion of births delivered
    by Caesarean section, and NMR. METHODS: We used data from Demographic and Health
    Surveys conducted in 10 African countries between 1997 and 2012. Kenya, Ghana
    and Senegal adopted policies removing user fees for facility-based deliveries
    between 2003 and 2007, while seven other countries not changing user fee policies
    were used as controls. We used a difference-in-differences (DD) regression approach
    to control for secular trends in the outcomes that are common across countries
    and for time invariant differences between countries. RESULTS: According to covariate-adjusted
    DD models, the policy change was consistent with an increase of 3.1 facility-based
    deliveries per 100 live births (95\% confidence interval (CI): 0.9, 5.2) and an
    estimated reduction of 2.9 neonatal deaths per 1000 births (95\% CI: -6.8, 1.0).
    In relative terms, this corresponds to a 5\% increase in facility deliveries and
    a 9\% reduction in NMR. There was no evidence of an increase in Caesarean deliveries.
    We examined lead and lag-time effects, finding evidence that facility deliveries
    continued to increase following fee removal. CONCLUSIONS: Our findings suggest
    removing user fees increased facility-based deliveries and possibly contributed
    to a reduction in NMR. Evidence from this evaluation may be useful to governments
    weighing the potential benefits of removing user fees.'
