  citation: '**Harper S**, Nandi A. "Empirical Challenges in Defining Treatments and
    Time in the Evaluation of Gun Laws" 2023; 34: 793--795. DOI: [10.1097/EDE.0000000000001663](https://doi.org/10.1097/EDE.0000000000001663)
