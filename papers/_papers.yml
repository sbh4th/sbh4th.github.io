  title: Impact Evaluation of the TAMANI Project to Improve Maternal and Child Health
    in Tanzania
  citation: 'Hetherington E*, **Harper S**, Davidson R, Festo C, Lampkin N, Mtenga
    S, Teixeira C, Vincent I, Nandi A. "Impact Evaluation of the TAMANI Project to
    Improve Maternal and Child Health in Tanzania" 2023; 77: 410--416. DOI: [10.1136/jech-2022-219995](https://doi.org/10.1136/jech-2022-219995)
    Citations: 2'
  doi: 10.1136/jech-2022-219995
  url: https://doi.org/10.1136/jech-2022-219995
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:C33y2ycGS3YC
  cites: 2
  abstract: 'Background The Tabora Maternal and Newborn Health Initiative project
    was a multicomponent intervention to improve maternal and newborn health in the
    Tabora region of Tanzania. Components included training healthcare providers and
    community health workers, infrastructure upgrades, and improvements to health
    management. This study aimed to examine the impact of trainings on four key outcomes:
    skilled birth attendance, antenatal care, respectful maternity care and patient–provider
    communication. Methods Trainings were delivered sequentially at four time points
    between 2018 and 2019 in eight districts (two districts at a time). Cross-sectional
    surveys were administered to a random sample of households in all districts at
    baseline and after each training wave. Due to practical necessities, the original
    stepped wedge cluster randomised design of the evaluation was altered mid-programme.
    Therefore, a difference-in-differences for multiple groups in multiple periods
    was adopted to compare outcomes in treated districts to not yet treated districts.
    Risk differences were estimated for the overall average treatment effect on the
    treated and group/time dynamic effects. Results Respondents reported 3895 deliveries
    over the course of the study. The intervention was associated with a 12.9 percentage
    point increase in skilled birth attendance (95\% CI 0.4 to 25.4), which began
    to increase 4 months after the end of training in each district. There was little
    evidence of impact on antenatal care visits, respectful treatment during delivery
    and patient–provider communication. Conclusion Interventions to train local healthcare
    workers in basic and comprehensive emergency obstetric and newborn care increased
    skilled birth attendance but had limited impact on other pregnancy-related outcomes.'
