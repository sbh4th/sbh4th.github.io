  citation: 'Austin N, **Harper S**. "Quantifying the Impact of Targeted Regulation
    of Abortion Provider Laws on US Abortion Rates: A Multi-State Assessment" 2019;
    100: 374--379. DOI: [10.1016/j.contraception.2019.06.003](https://doi.org/10.1016/j.contraception.2019.06.003)
