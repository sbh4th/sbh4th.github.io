  title: Primary Enforcement of Mandatory Seat Belt Laws and Motor Vehicle Crash Deaths
  citation: '**Harper S**, Strumpf E. "Primary Enforcement of Mandatory Seat Belt
    Laws and Motor Vehicle Crash Deaths" 2017; 53: 176--183. DOI: [10.1016/j.amepre.2017.02.003](https://doi.org/10.1016/j.amepre.2017.02.003)
    Citations: 22'
  doi: 10.1016/j.amepre.2017.02.003
