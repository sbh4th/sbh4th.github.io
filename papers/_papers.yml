- key: elani2012
  category: ARTICLE
  title: Socio-Economic Inequalities and Oral Health in Canada and the United States
  citation: 'Elani H, **Harper S**, Allison P, Bedos C, Kaufman J. "Socio-Economic
    Inequalities and Oral Health in Canada and the United States" 2012; 91: 865--870.
    DOI: [10.1177/0022034512455062](https://doi.org/10.1177/0022034512455062)'
  doi: 10.1177/0022034512455062
  url: https://doi.org/10.1177/0022034512455062
  abstract: 'This paper describes and compares the magnitude of socio-economic inequalities
    in oral health among adults in Canada and the US over the past 35 years. We analyzed
    data from nationally representative examination surveys in Canada and the US:
    Nutrition Canada National Survey (1970-1972, N = 11,546), Canadian Health Measures
    Survey (2007-2009, N = 3,508), The First National Health and Nutrition Examination
    Survey (1971-1974, N = 13,131), and National Health and Nutrition Examination
    Survey (2007-2008, N = 5,707). Oral health outcomes examined were prevalence of
    edentulism, proportion of individuals having at least 1 untreated decayed tooth,
    and proportion of individuals having at least 1 filled tooth. Sociodemographic
    indicators included in our analysis were place of birth, education, and income.
    Data were age-adjusted, and survey weights were used to account for the complex
    survey design in making population inferences. Our findings demonstrate that oral
    health outcomes have improved for adults in both countries. In the 1970s, Canada
    had a higher prevalence of edentulism and dental decay and lower prevalence of
    filled teeth. This was also combined with a more pronounced social inequality
    gradient among place of birth, education, and income groups. Over time, both countries
    demonstrated a decline in absolute socio-economic inequalities in oral health.
    © 2012 International \& American Associations for Dental Research.'
  has_summary: no
  year: '2012'
- key: Harper:2012ee
  category: ARTICLE
  title: Do Medical Marijuana Laws Increase Marijuana Use? Replication Study and Extension
  citation: '**Harper S**, Strumpf EC, Kaufman JS. "Do Medical Marijuana Laws Increase
    Marijuana Use? Replication Study and Extension" 2012; 22: 207--12. DOI: [10.1016/j.annepidem.2011.12.002](https://doi.org/10.1016/j.annepidem.2011.12.002)
    Citations: 299'
  doi: 10.1016/j.annepidem.2011.12.002
  url: https://doi.org/10.1016/j.annepidem.2011.12.002
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:isC4tDSrTZIC
  cites: 299
  abstract: 'PURPOSE: To replicate a prior study that found greater adolescent marijuana
    use in states that have passed medical marijuana laws (MMLs), and extend this
    analysis by accounting for confounding by unmeasured state characteristics and
    measurement error. METHODS: We obtained state-level estimates of marijuana use
    from the 2002 through 2009 National Survey on Drug Use and Health. We used 2-sample
    t-tests and random-effects regression to replicate previous results. We used difference-in-differences
    regression models to estimate the causal effect of MMLs on marijuana use, and
    simulations to account for measurement error. RESULTS: We replicated previously
    published results showing higher marijuana use in states with MMLs. Difference-in-differences
    estimates suggested that passing MMLs decreased past-month use among adolescents
    by 0.53 percentage points (95\% confidence interval [CI], 0.03-1.02) and had no
    discernible effect on the perceived riskiness of monthly use. Models incorporating
    measurement error in the state estimates of marijuana use yielded little evidence
    that passing MMLs affects marijuana use. CONCLUSIONS: Accounting for confounding
    by unmeasured state characteristics and measurement error had an important effect
    on estimates of the impact of MMLs on marijuana use. We find limited evidence
    of causal effects of MMLs on measures of reported marijuana use.'
