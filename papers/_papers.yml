- key: king2014
  category: ARTICLE
  title: 'Determinants of Increased Opioid-Related Mortality in the United States
    and Canada, 1990-2013: A Systematic Review'
  citation: 'King N, Fraser V, Boikos C, Richardson R, **Harper S**. "Determinants
    of Increased Opioid-Related Mortality in the United States and Canada, 1990-2013:
    A Systematic Review" 2014; 104: e32-e42. DOI: [10.2105/AJPH.2014.301966](https://doi.org/10.2105/AJPH.2014.301966)
    Citations: 377'
  doi: 10.2105/AJPH.2014.301966
  url: https://doi.org/10.2105/AJPH.2014.301966
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:t6usbXjVLHcC
  cites: 377
  abstract: 'We review evidence of determinants contributing to increased opioid-related
    mortality in the United States and Canada between 1990 and 2013. We identified
    17 determinants of opioid-relatedmortality andmortality increases that we classified
    into 3 categories: prescriber behavior, user behavior and characteristics, and
    environmental and systemic determinants. These determinants operate independently
    but interact in complex ways that vary according to geography and population,making
    generalization from single studies inadvisable. Researchers in this area face
    significant methodological difficulties; most of the studies in our review were
    ecological or observational and lacked control groups or adjustment for confounding
    factors; thus, causal inferences are difficult. Preventing additional opioid-related
    mortality will likely require interventions that address multiple determinants
    and are tailored to specific locations and populations.'
