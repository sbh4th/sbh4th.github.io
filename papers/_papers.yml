  title: Did the Great Recession Increase Suicides in the USA? Evidence from an Interrupted
    Time-Series Analysis
  citation: '**Harper S**, Bruckner T. "Did the Great Recession Increase Suicides
    in the USA? Evidence from an Interrupted Time-Series Analysis" 2017; 27: 409-414.e6.
    DOI: [10.1016/j.annepidem.2017.05.017](https://doi.org/10.1016/j.annepidem.2017.05.017)
    Citations: 55'
  doi: 10.1016/j.annepidem.2017.05.017
