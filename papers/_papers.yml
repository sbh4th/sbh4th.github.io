  title: Prevalence of Alpha, Beta, and Gamma Human Papillomaviruses in Patients with
    Head and Neck Cancer and Noncancer Controls and Relation to Behavioral Factors
  citation: 'Al-Soneidar W*, **Harper S**, Coutlée F, Gheit T, Tommasino M, Nicolau
    B. "Prevalence of Alpha, Beta, and Gamma Human Papillomaviruses in Patients with
    Head and Neck Cancer and Noncancer Controls and Relation to Behavioral Factors"
    2024; 229: 1088--1096. DOI: [10.1093/infdis/jiad335](https://doi.org/10.1093/infdis/jiad335)
    Citations: 3'
