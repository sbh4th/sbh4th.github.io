- key: manuel2014
  category: ARTICLE
  title: 'Modelling Preventive Effectiveness to Estimate the Equity Tipping Point:
    At What Coverage Can Individual Preventive Interventions Reduce Socioeconomic
    Disparities in Diabetes Risk?'
  citation: 'Manuel D, Ho T, **Harper S**, Anderson G, Lynch J, Rosella L. "Modelling
    Preventive Effectiveness to Estimate the Equity Tipping Point: At What Coverage
    Can Individual Preventive Interventions Reduce Socioeconomic Disparities in Diabetes
    Risk?" 2014; 34: 94--102. Citations: 10'
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:AXPGKjj_ei8C
  cites: 10
  abstract: 'Introduction: Most individual preventive therapies potentially narrow
    or widen health disparities depending on the difference in community effectiveness
    across socioeconomic position (SEP). The equity tipping point-defined as the point
    at which health disparities become larger-can be calculated by varying components
    of community effectiveness such as baseline risk of disease, intervention coverage
    and/ or intervention efficacy across SEP. Methods: We used a simple modelling
    approach to estimate the community effectiveness of diabetes prevention across
    SEP in Canada under different scenarios of intervention coverage. Results: Five-year
    baseline diabetes risk differed between the lowest and highest income groups by
    1.76\%. Assuming complete coverage across all income groups, the difference was
    reduced to 0.90\% (144 000 cases prevented) with lifestyle interventions and 1.24\%
    (88 100 cases prevented) with pharmacotherapy. The equity tipping point was estimated
    to be a coverage difference of 30\% for preventive interventions (100\% and 70\%
    coverage among the highest and lowest income earners, respectively). Conclusion:
    Disparities in diabetes risk could be measurably reduced if existing interventions
    were equally adopted across SEP. However, disparities in coverage could lead to
    increased inequity in risk. Simple modelling approaches can be used to examine
    the community effectiveness of individual preventive interventions and their potential
    to reduce (or increase) disparities. The equity tipping point can be used as a
    critical threshold for disparities analyses.'
  has_summary: no
  year: '2014'
- key: mckinnon2014
  category: ARTICLE
  title: Distance to Emergency Obstetric Services and Early Neonatal Mortality in
    Ethiopia
  citation: 'McKinnon B, **Harper S**, Kaufman JS, Abdullah M. "Distance to Emergency
    Obstetric Services and Early Neonatal Mortality in Ethiopia" 2014; 19: 780--790.
    DOI: [10.1111/tmi.12323](https://doi.org/10.1111/tmi.12323)'
  doi: 10.1111/tmi.12323
  url: https://doi.org/10.1111/tmi.12323
  abstract: 'Objectives To assess the effect of distance to emergency obstetric and
    newborn care (EmONC) services on early neonatal mortality in rural Ethiopia and
    examine whether proximity to services contributes to socio-economic inequalities
    in early neonatal mortality. Methods We linked data from the 2011 Ethiopian Demographic
    and Health Survey with facility data from the 2008 Ethiopian National EmONC Needs
    Assessment based on geographical coordinates collected in both surveys. Health
    facilities were classified based on the performance of nine EmONC signal functions
    (e.g. neonatal resuscitation, Caesarean section). We used multivariable logistic
    regression to assess the relationship between distance to services and early neonatal
    mortality. A decomposition approach was used to quantify the relative contributions
    of distance to EmONC services and other determinants to overall and socio-economic
    inequality in early neonatal mortality. Results In general, closer proximity to
    EmONC services and higher level of care were associated with lower early neonatal
    mortality. Living more than 80 km from the nearest comprehensive EmONC facility
    able to perform all nine signal functions compared to living within 10 km was
    associated with an increase of 14.4 early neonatal deaths per 1000 live births
    (95\% CI: 0.1, 28.7). Closer proximity to a substandard EmONC facility compared
    with no facility was not associated with lower early neonatal mortality. Distance
    to EmONC services was an important determinant of early neonatal mortality, although
    it did not make a significant contribution to explaining socio-economic inequality.
    Conclusions Our results suggest that recent initiatives by the Ethiopian government
    to improve geographical access to EmONC services have the potential to reduce
    early neonatal mortality but may not affect inequalities.'
  has_summary: no
  year: '2014'
- key: mckinnon2014b
  category: ARTICLE
  title: 'Socioeconomic Inequality in Neonatal Mortality in Countries of Low and Middle
    Income: A Multicountry Analysis'
  citation: 'McKinnon B, **Harper S**, Kaufman J, Bergevin Y. "Socioeconomic Inequality
    in Neonatal Mortality in Countries of Low and Middle Income: A Multicountry Analysis"
    2014; 2: e165-e173. DOI: [10.1016/S2214-109X(14)70008-7](https://doi.org/10.1016/S2214-109X(14)70008-7)
    Citations: 163'
  doi: 10.1016/S2214-109X(14)70008-7
  url: https://doi.org/10.1016/S2214-109X(14)70008-7
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:BrmTIyaxlBUC
  cites: 163
  abstract: 'Background: Neonatal mortality rates (NMRs) in countries of low and middle
    income have been only slowly decreasing; coverage of essential maternal and newborn
    health services needs to increase, particularly for disadvantaged populations.
    Our aim was to produce comparable estimates of changes in socioeconomic inequalities
    in NMR in the past two decades across these countries. Methods: We used data from
    Demographic and Health Surveys (DHS) for countries in which a survey was done
    in 2008 or later and one about 10 years previously. We measured absolute inequalities
    with the slope index of inequality and relative inequalities with the relative
    index of inequality. We used an asset-based wealth index and maternal education
    as measures of socioeconomic position and summarised inequality estimates for
    all included countries with random-effects meta-analysis. Findings: 24 low-income
    and middle-income countries were eligible for inclusion. In most countries, absolute
    and relative wealth-related and educational inequalities in NMR decreased between
    survey 1 and survey 2. In five countries (Cameroon, Nigeria, Malawi, Mozambique,
    and Uganda), the difference in NMR between the top and bottom of the wealth distribution
    was reduced by more than two neonatal deaths per 1000 livebirths per year. By
    contrast, wealth-related inequality increased by more than 1·5 neonatal deaths
    per 1000 livebirths per year in Ethiopia and Cambodia. Patterns of change in absolute
    and relative educational inequalities in NMR were similar to those of wealth-related
    NMR inequalities, although the size of educational inequalities tended to be slightly
    larger. Interpretation: Socioeconomic inequality in NMR seems to have decreased
    in the past two decades in most countries of low and middle income. However, a
    substantial survival advantage remains for babies born into wealthier households
    with a high educational level, which should be considered in global efforts to
    further reduce NMR. Funding: Canadian Institutes of Health Research. © 2014 McKinnon
    et al.'
  has_summary: no
  year: '2014'
- key: smith2014
  category: ARTICLE
  title: 'Reducing Social Inequalities in Health: The Role of Simulation Modelling
    in Chronic Disease Epidemiology to Evaluate the Impact of Population Health Interventions'
  citation: 'Smith B, Smith P, **Harper S**, Manuel D, Mustard C. "Reducing Social
    Inequalities in Health: The Role of Simulation Modelling in Chronic Disease Epidemiology
    to Evaluate the Impact of Population Health Interventions" 2014; 68: 384--389.
    DOI: [10.1136/jech-2013-202756](https://doi.org/10.1136/jech-2013-202756) Citations:
    41'
  doi: 10.1136/jech-2013-202756
  url: https://doi.org/10.1136/jech-2013-202756
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:fQNAKQ3IYiAC
  cites: 41
  abstract: Reducing health inequalities has become a major public health priority
    internationally. However, how best to achieve this goal is not well understood.
    Population health intervention research has the potential to address some of this
    knowledge gap. This review argues that simulation studies can produce unique evidence
    to build the population health intervention research evidence base on reducing
    social inequalities in health. To this effect, the advantages of using simulation
    models over other population health intervention research methods are discussed.
    Key questions regarding the potential challenges of developing simulation models
    to investigate population health intervention research on reducing social inequalities
    in health and the types of population health intervention research questions that
    can be answered using this methodology are reviewed. We use the example of social
    inequalities in coronary heart disease to illustrate how simulation models can
    elucidate the effectiveness of a number of 'what-if' counterfactual population
    health interventions on reducing social inequalities in coronary heart disease.
    Simulation models are a flexible, cost-effective, evidencebased research method
    with the capacity to inform public health policy-makers regarding the implementation
    of population health interventions to reduce social inequalities in health.
