- key: adam-smith2011
  category: ARTICLE
  title: Causes of Widening Life Expectancy Inequalities in Québec, Canada, 1989-2004
  citation: 'Adam-Smith J, **Harper S**, Auger N. "Causes of Widening Life Expectancy
    Inequalities in Québec, Canada, 1989-2004" 2011; 102: 375--381. DOI: [10.1007/bf03404180](https://doi.org/10.1007/bf03404180)
    Citations: 7'
  doi: 10.1007/bf03404180
  url: https://doi.org/10.1007/bf03404180
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:TQgYirikUcIC
  cites: 7
  abstract: 'Objectives: Inequalities in life expectancy between the most and least
    materially deprived areas in the province of Quebec, Canada are increasing, but
    the reasons for this trend are unclear. An analysis of which causes of death,
    in which age groups, are implicated in this trend is necessary to understand it
    and provide clear targets for intervention. Methods: We analyzed Québec mortality
    data for three 4-year periods from 1989-2004. Differences in life expectancy at
    birth between the most- and least-deprived areas in each period and over time
    were decomposed by age and cause of death for men and women using the Arriaga
    method. Results: Life expectancy increased for all areas, but the increase was
    smaller in deprived areas. Cancer, heart disease and unintentional injuries accounted
    for the largest shares of inequality in each period. Among women, the widening
    life expectancy gap was largely due to increased lung cancer mortality. Among
    men, mortality from HIV was an important cause of widening inequality. Increasing
    inequality in both sexes was offset by a decrease in mortality from unintentional
    injuries in deprived areas (narrowing the gap between the most- and least-deprived
    areas). The largest share of inequality among women was due to deaths in the 65-and-over
    age group. Among men, the largest share shifted over time from middle-age to the
    65-and-over age group. Conclusion: The widening life expectancy gap between advantaged
    and disadvantaged areas in Québec is driven by relatively few causes of death
    with well-known risk factors and strategies for prevention. © Canadian Public
    Health Association, 2011. All rights reserved.'
  has_summary: no
  year: '2011'
- key: agha2011
  category: ARTICLE
  title: Relation of Socioeconomic Position with Ankle-Brachial Index
  citation: 'Agha G, Murabito J, Lynch J, Abrahamowicz M, **Harper S**, Loucks E.
    "Relation of Socioeconomic Position with Ankle-Brachial Index" 2011; 108: 1651--1657.
    DOI: [10.1016/j.amjcard.2011.07.030](https://doi.org/10.1016/j.amjcard.2011.07.030)
    Citations: 8'
  doi: 10.1016/j.amjcard.2011.07.030
  url: https://doi.org/10.1016/j.amjcard.2011.07.030
  url_scholar: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=Ipf8idcAAAAJ&citation_for_view=Ipf8idcAAAAJ:TFP_iSt0sucC
  cites: 8
  abstract: Potential upstream determinants of coronary heart disease (CHD) include
    life-course socioeconomic position (e.g., childhood socioeconomic circumstances,
    own education and occupation); however, several plausible biological mechanisms
    by which socioeconomic position (SEP) may influence CHD are poorly understood.
    Several CHD risk factors appear to be more strongly associated with SEP in women
    than in men; little is known as to whether any CHD risk factors may be more strongly
    associated with SEP in men. Objectives were to evaluate whether cumulative life-course
    SEP is associated with a measurement of subclinical atherosclerosis, the anklebrachial
    index (ABI), in men and women. This study was a prospective analysis of 1,454
    participants from the Framingham Heart Study Offspring Cohort (mean age 57 years,
    53.8\% women). Cumulative SEP was calculated by summing tertile scores for father's
    education, own education, and own occupation. ABI was dichotomized as low (≤1.1)
    and normal ({$>$}1.1 to 1.4). After adjustment for age and CHD risk factors cumulative
    life-course SEP was associated with low ABI in men (odds ratio [OR] 2.04, 95\%
    confidence interval [CI] 1.22 to 3.42, for low vs high cumulative SEP score) but
    not in women (OR 0.86, 95\% CI 0.56 to 1.33). Associations with low ABI in men
    were substantially driven by their own education (OR 4.13, 95\% CI 1.86 to 9.16,
    for lower vs higher than high school education). In conclusion, cumulative life-course
    SEP was associated with low ABI in men but not in women. © 2011 Elsevier Inc.
    All rights reserved.
  has_summary: no
  year: '2011'
- key: auger2011
  category: ARTICLE
  title: Increasing Educational Inequality in Preterm Birth in Québec, Canada, 1981–2006
  citation: 'Auger N, Roncarolo F, **Harper S**. "Increasing Educational Inequality
    in Preterm Birth in Québec, Canada, 1981–2006" 2011; 65: 1091--1096. DOI: [10.1136/jech.2009.102350](https://doi.org/10.1136/jech.2009.102350)'
  doi: 10.1136/jech.2009.102350
  url: https://doi.org/10.1136/jech.2009.102350
  abstract: Background Few studies have evaluated the relationship between preterm
    birth (PTB) and maternal education over time. We sought to determine whether educational
    inequalities in PTB have increased in Québec, Canada. Methods The authors analysed
    2 124 909 singleton live births from 1981 to 2006, and computed the Relative Index
    of Inequality (RII) and Slope Index of Inequality (SII) with 95\% CIs for the
    relationship between maternal education and extreme, very or moderate PTB (≤27,
    28–31, and 32–36 completed weeks of gestation, respectively) for five periods
    (1981–1985, 1986–1990, 1991–1995, 1996–2000, 2001–2006), adjusting for maternal
    age, marital status, birthplace, language spoken at home, parity and infant sex.
    Results Average rates of extreme and moderate PTB increased over time but decreased
    for very PTB. A statistically significant increase in the RII over time was present
    for extreme and moderate PTB. The adjusted RII for extreme PTB increased from
    1.58 (95\% CI 1.24 to 2.01) in 1981–1985 to 3.11 (95\% CI 2.54 to 3.81) in 2001–2006.
    For moderate PTB, the corresponding RIIs were 1.53 (95\% CI 1.44 to 1.61) and
    1.91 (95\% CI 1.81 to 2.01). Absolute differences in the PTB proportion between
    the least and most educated mothers increased from 1981 to 2006 for extreme (adjusted
    SII 0.11\% vs 0.28\%) and moderate PTB (adjusted SII 1.67\% vs 3.11\%). Absolute
    differences in the proportion very PTB did not increase. Conclusions Relative
    and absolute educational inequalities in extreme and moderate PTB have increased
    over time in Québec. Relative increases were largest for extreme PTB, and absolute
    increases were largest for moderate PTB.
