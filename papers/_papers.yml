  title: 'Balancing Work and Care: The Effect of Paid Adult Medical Leave Policies
    on Employment in Europe'
  citation: 'Jahagirdar D, Dimitris M, Strumpf E, Kaufman JS, **Harper S**, Heymann
    J, Atabay E, Vincent I, Nandi A. "Balancing Work and Care: The Effect of Paid
    Adult Medical Leave Policies on Employment in Europe" 2021; 50: 552--568. DOI:
