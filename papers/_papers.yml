  title: 'Monitoring Equity in Vaccination Coverage: A Systematic Analysis of Demographic
    and Health Surveys from 45 Gavi-supported Countries'
  citation: 'Arsenault C*, **Harper S**, Nandi A, Mendoza Rodríguez J, Hansen P, Johri
    M. "Monitoring Equity in Vaccination Coverage: A Systematic Analysis of Demographic
    and Health Surveys from 45 Gavi-supported Countries" 2017; 35: 951--959. DOI:
