  title: 'Trauma Surveillance and Registry Development in Mozambique: Results of a
    1-Year Study and the First Phase of National Implementation'
  citation: 'Hamadani F, Razek T, Massinga E, Gupta S, Muataco M, Muripiha P, Maguni
    C, Muripa V, Percina I, Costa A, Yohannan P, Bracco D, Wong E, **Harper S**, Deckelbaum
    D, Neves O. "Trauma Surveillance and Registry Development in Mozambique: Results
    of a 1-Year Study and the First Phase of National Implementation" 2019; 43: 1628--1635.
    DOI: [10.1007/s00268-019-04947-7](https://doi.org/10.1007/s00268-019-04947-7)
    Citations: 17'
