  citation: 'Yang S, Khang Y, **Harper S**, Smith G, Leon D, Lynch J. "Understanding
    the Rapid Increase in Life Expectancy in South Korea" 2010; 100: 896--903. DOI:
    [10.2105/AJPH.2009.160341](https://doi.org/10.2105/AJPH.2009.160341) Citations:
