  title: Life Course Socioeconomic Conditions and Adult Psychosocial Functioning
  citation: '**Harper S**, Lynch J, Hsu W, Everson S, Hillemeier M, Raghunathan T,
    Salonen J, Kaplan G. "Life Course Socioeconomic Conditions and Adult Psychosocial
    Functioning" 2002; 31: 395--403. DOI: [10.1093/intjepid/31.2.395](https://doi.org/10.1093/intjepid/31.2.395)
    Citations: 246'
  doi: 10.1093/intjepid/31.2.395
