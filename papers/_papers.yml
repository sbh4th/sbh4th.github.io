    the India Human Development Survey'
  citation: 'Arsenault C*, **Harper S**, Nandi A. "Effect of Vaccination on Children’s
    Learning Achievements: Findings from the India Human Development Survey" 2020;
    74: 778--784. DOI: [10.1136/jech-2019-213483](https://doi.org/10.1136/jech-2019-213483)
    Citations: 10'
  doi: 10.1136/jech-2019-213483
