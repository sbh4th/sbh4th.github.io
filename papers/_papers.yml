- key: farhat2026
  category: ARTICLE
  title: 'Trends in Chronic Hepatitis C Visits by Providers in Quebec, Canada: A Population-Level
    Cohort Study'
  citation: 'Farhat I*, Greenaway C, **Harper S**, Panagiotoglou D. "Trends in Chronic
    Hepatitis C Visits by Providers in Quebec, Canada: A Population-Level Cohort Study"
    2026; 9: 464--474. DOI: [10.3138/canlivj-2026-0017](https://doi.org/10.3138/canlivj-2026-0017)'
  doi: 10.3138/canlivj-2026-0017
  url: https://doi.org/10.3138/canlivj-2026-0017
  abstract: 'Abstract              Background:        Despite primary care''s role
    in hepatitis C elimination, evidence of primary care providers’ involvement remains
    limited. To enhance our knowledge of health care use among hepatitis C–infected
    individuals, we described trends in hepatitis-related visits and patients’ characteristics
    by provider specialty in Quebec.                     Methods:        We conducted
    a population-based cohort study using all hepatitis C cases in the Quebec Mandatory
    Reportable Disease database (1990–2018), linked with the provincial physician
    billing database. We described monthly rates of hepatitis-related medical visits
    using a generalized additive model across different provider specialties and stratified
    our results by at-risk populations.                     Results:        Between
    1990 and 2018, 37,251 patients were diagnosed with hepatitis C. Visit rates were
    lower for other specialties compared to gastroenterologists; rate ratios (RRs)
    were 0.73 (95\% CI 0.67–0.79) for general practitioners/family physicians (GPs/FPs)
    and 0.24 (95\% CI 0.21–0.26) for internal medicine physicians. The RR for GPs/FPs
    was 1.21(95\% CI 1.05–1.39) among people who inject drugs (PWID), 0.76 (95\% CI
    0.71–0.82) among the 1945–1975 birth cohort, and 0.37 (95\% CI 0.28–0.49) among
    immigrants, compared to gastroenterologists. Patients seen primarily by GPs/FPs
    were more likely to have a history of drug use and mental health disorders than
    those seen by specialists.                     Conclusions:        Hepatitis C
    cases were more likely to be seen by gastroenterologists than by GPs/FPs in Quebec
    from 1990 to 2018. However, GPs/FPs had higher visit rates for PWID. Specialists
    more often managed immigrants and the 1945–1975 cohort. These findings suggest
    disparities in care access and emphasize GPs/FPs’ role in managing hepatitis C
    among marginalized populations.            ,       Lay Summary       Primary care
    physicians can be part of the solution for the elimination of hepatitis C, a virus
    that infects the liver and leads to liver complications. The treatment for hepatitis
    C was simplified in the mid-2010s with second-generation direct-acting antivirals
    (DAAs), which reduce side effects and treatment time. Despite this breakthrough,
    we do not know which specialties of physicians treat patients with hepatitis C.
    Our goal was to examine the specialties of physicians treating patients with hepatitis
    C in Quebec. We looked at 37,251 hepatitis C patients reported to the Quebec Mandatory
    Reportable Disease database (1990–2018). We observed that gastroenterologists
    and liver specialists saw the largest number of patients from 1990 to 2018. When
    we looked at people who inject drugs living with hepatitis C, we observed that
    primary care physicians saw the largest number of patients. These results led
    us to hypothesize about potential barriers to specialist care for marginalized
    populations.'
