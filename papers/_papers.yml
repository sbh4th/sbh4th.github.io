  title: A Multivariable Model for Improving the Identification of Cerebral Palsy
    Cases in Administrative Health Data
  citation: 'Socha P*, Oskoui M, Hutcheon J, **Harper S**. "A Multivariable Model
    for Improving the Identification of Cerebral Palsy Cases in Administrative Health
    Data" 2026; 114: 26--31. DOI: [10.1016/j.annepidem.2026.01.004](https://doi.org/10.1016/j.annepidem.2026.01.004)
