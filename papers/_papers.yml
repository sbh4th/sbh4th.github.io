  title: 'Access to Affordable Daycare and Women’s Mental Health in Rajasthan, India:
    Evidence from a Cluster-Randomised Social Intervention'
  citation: 'Nandi A, Agarwal P, Chandrashekar A, Maloney S, Richardson R, Thakur
    L, **Harper S**. "Access to Affordable Daycare and Women’s Mental Health in Rajasthan,
    India: Evidence from a Cluster-Randomised Social Intervention" 2024; 14: 04063.
