project:
  type: website
  output-dir: docs
  resources:
    - CNAME

execute:
  freeze: auto

website:
  title: "Sam Harper"
  site-url: "https://samharper.org"
  repo-url: "https://github.com/sbh4th/qweb"
  repo-actions: [issue]
  navbar:
    search: true
    right:
      - href: index.qmd
        text: Home
      # - about.qmd
      - text: "Teaching"
        file: teaching/index.qmd
      - text: "Posts"
        file: posts/index.qmd
      - text: "Talks"
        file: talks/index.qmd
      - text: "Projects"
        file: projects/index.qmd
      - text: "Papers"
        file: papers/index.qmd
      - text: "CV"
        file: cv/index.qmd

format:
  html:
    theme: litera
    css: styles.css
    toc: true
    mainfont: "Roboto Slab"
    include-in-header:
      - file: _includes/header.html
      - text: |
          <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;600&display=swap" rel="stylesheet">
          <style>
            body, p, li, td, th { font-family: 'Roboto Slab', serif !important; font-weight: 400; color: rgb(54, 55, 55); }
            h1, h2, h3, h4 { font-family: 'Roboto Slab', serif !important; font-weight: 600; color: rgb(54, 55, 55); }
            body { line-height: 1.8; }
          </style>

editor: source

